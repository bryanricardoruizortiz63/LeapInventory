<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Inventario Escolar Pro</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1e40af">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inventario">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">

<style>
  :root{
    --primary: #1e40af;
    --primary-2: #2563eb;
    --accent: #3b82f6;
    --danger: #dc2626;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-soft: #475569;
    --muted: #94a3b8;
    --radius: 16px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: #f1f5f9;
    color: var(--text);
    -webkit-user-select: none;
    user-select: none;
  }
  input, textarea, select { -webkit-user-select: text; user-select: text; }

  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: linear-gradient(180deg, var(--primary) 0%, var(--primary-2) 100%);
    color: #fff;
    padding: calc(14px + var(--safe-top)) 16px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 2px 12px rgba(15,23,42,.15);
  }
  header h1 {
    font-size: 19px;
    margin: 0;
    font-weight: 700;
    flex: 1;
  }
  header button {
    background: rgba(255,255,255,.16);
    border: none;
    color: #fff;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
  }
  header button:active { background: rgba(255,255,255,.3); }

  .preset-bar {
    background: #fff;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .preset-bar::-webkit-scrollbar { display: none; }
  .preset-btn {
    flex: 0 0 auto;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: #fff;
    color: var(--text-soft);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .preset-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  .summary {
    display: flex;
    gap: 10px;
    padding: 12px 16px 0;
  }
  .summary .stat {
    flex: 1;
    background: #fff;
    border-radius: 14px;
    padding: 10px 12px;
    box-shadow: 0 1px 3px rgba(15,23,42,.08);
  }
  .summary .stat .n { font-size: 20px; font-weight: 800; color: var(--primary); }
  .summary .stat .l { font-size: 11.5px; color: var(--text-soft); }

  main { padding: 6px 16px 140px; }
  .empty-state { text-align: center; color: var(--text-soft); padding: 60px 24px; }
  .item-card {
    background: #fff;
    border-radius: var(--radius);
    padding: 13px 14px;
    margin-bottom: 10px;
    box-shadow: 0 1px 3px rgba(15,23,42,.07);
    display: flex;
    gap: 12px;
    align-items: center;
    cursor: pointer;
  }
  .item-card .thumb {
    width: 44px;
    height: 44px;
    border-radius: 11px;
    background: #eef2ff;
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    font-weight: 700;
  }
  .item-card .info { flex: 1; }
  .item-card .title { font-weight: 700; font-size: 15px; }
  .item-card .sub { font-size: 12.5px; color: var(--text-soft); margin-top: 2px; }

  .fab-wrap {
    position: fixed;
    right: 18px;
    bottom: calc(20px + var(--safe-bottom));
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
  }
  .fab {
    display: flex;
    align-items: center;
    gap: 8px;
    border: none;
    cursor: pointer;
    color: #fff;
    border-radius: 999px;
    box-shadow: 0 6px 16px rgba(15,23,42,.25);
    font-weight: 700;
    font-size: 14px;
    padding: 0 18px;
    height: 52px;
  }
  .fab.scan { background: linear-gradient(135deg, var(--primary-2), var(--primary)); }
  .fab.add {
    background: #fff;
    color: var(--primary);
    height: 44px;
    font-size: 13px;
    box-shadow: 0 4px 10px rgba(15,23,42,.15);
  }

  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.5);
    z-index: 40;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 41;
    background: #f8fafc;
    border-radius: 20px 20px 0 0;
    max-height: 90vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform .22s ease;
    padding-bottom: var(--safe-bottom);
  }
  .sheet.show { transform: translateY(0); }
  .sheet-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  .sheet-header h2 { font-size: 16.5px; margin: 0; flex: 1; }
  .sheet-header button {
    background: none;
    border: none;
    font-size: 22px;
    color: var(--text-soft);
    cursor: pointer;
    padding: 4px 6px;
  }
  .sheet-body {
    padding: 14px 16px 18px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .field {
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-soft);
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 12px;
    padding: 11px 12px;
    font-size: 15.5px;
    color: var(--text);
    outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59,130,246,.15);
  }
  .field textarea { min-height: 70px; resize: vertical; }
  .field.required label:after { content: " *"; color: var(--danger); }

  .field-lock {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    background: #f1f5f9;
    border-radius: 10px;
    margin-top: 4px;
  }
  .field-lock input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
  }
  .field-lock label {
    margin: 0;
    text-transform: none;
    font-size: 12px;
    cursor: pointer;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }
  .btn {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 13px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn.primary { background: var(--primary); color: #fff; }
  .btn.ghost { background: #e2e8f0; color: var(--text); }
  .btn.danger { background: #fee2e2; color: var(--danger); }

  #scanner-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 50;
    display: none;
    flex-direction: column;
  }
  #scanner-overlay.show { display: flex; }

  .scanner-header {
    padding: calc(14px + var(--safe-top)) 16px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fff;
    background: linear-gradient(180deg, rgba(0,0,0,.8), transparent);
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2;
  }
  .scanner-header button {
    background: rgba(255,255,255,.18);
    border: none;
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
  }

  #scanner-viewport {
    flex: 1;
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .scanner-indicator {
    position: absolute;
    top: calc(70px + var(--safe-top));
    left: 16px;
    right: 16px;
    z-index: 2;
    background: linear-gradient(135deg, rgba(30,64,175,.95), rgba(37,99,235,.95));
    color: #fff;
    padding: 16px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  .scanner-indicator .counter {
    font-size: 13px;
    font-weight: 600;
    opacity: .9;
    margin-bottom: 6px;
  }
  .scanner-indicator .field-name {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -.5px;
  }
  .scanner-indicator.success {
    background: linear-gradient(135deg, rgba(34,197,94,.95), rgba(22,163,74,.95));
  }
  .scanner-indicator.success .field-name:before { content: "✓ "; }

  .scanner-hint {
    position: absolute;
    bottom: calc(28px + var(--safe-bottom));
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255,255,255,.8);
    font-size: 13px;
    z-index: 2;
    padding: 0 24px;
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + var(--safe-bottom));
    transform: translate(-50%, 20px);
    background: #0f172a;
    color: #fff;
    padding: 11px 18px;
    border-radius: 99px;
    font-size: 13.5px;
    font-weight: 600;
    box-shadow: 0 6px 18px rgba(0,0,0,.3);
    z-index: 60;
    opacity: 0;
    pointer-events: none;
    transition: all .2s;
    max-width: 88vw;
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<header>
  <h1>📦 Inventario Escolar Pro</h1>
  <button id="btn-export" title="Exportar">⬇︎</button>
  <button id="btn-settings" title="Gestionar">⚙︎</button>
</header>

<div class="preset-bar" id="preset-bar"></div>

<div class="summary">
  <div class="stat"><div class="n" id="stat-count">0</div><div class="l">Artículos</div></div>
  <div class="stat"><div class="n" id="stat-preset">0</div><div class="l">En grupo</div></div>
</div>

<main>
  <div id="list-container"></div>
  <div class="empty-state" id="empty-state" style="display:none;">
    <div style="font-size:44px;margin-bottom:10px;">🗃️</div>
    <p><b>Sin artículos en este grupo.</b></p>
  </div>
</main>

<div class="fab-wrap">
  <button class="fab add" id="btn-add-manual">➕ Añadir</button>
  <button class="fab scan" id="btn-scan"><span>📷</span> Escanear</button>
</div>

<div id="scanner-overlay">
  <div class="scanner-header">
    <button id="btn-close-scanner">✕</button>
    <button id="btn-manual-scan" style="margin-left:auto;">⌨️</button>
    <button id="btn-torch">💡</button>
  </div>
  <div class="scanner-indicator" id="scanner-indicator">
    <div class="counter" id="scanner-counter">1 de 2</div>
    <div class="field-name" id="scanner-field-name">CÓDIGO DE BARRAS</div>
  </div>
  <div id="scanner-viewport"></div>
  <div class="scanner-hint">Acerca el código a la cámara</div>
</div>

<div class="backdrop" id="backdrop"></div>

<div class="sheet" id="item-sheet">
  <div class="sheet-header">
    <h2 id="item-sheet-title">Nuevo artículo</h2>
    <button id="btn-close-item">✕</button>
  </div>
  <div class="sheet-body" id="item-form-fields"></div>
</div>

<div class="sheet" id="presets-sheet">
  <div class="sheet-header">
    <h2>Gestionar grupos</h2>
    <button id="btn-close-presets">✕</button>
  </div>
  <div class="sheet-body">
    <div id="presets-list"></div>
    <div class="btn-row">
      <button class="btn ghost" id="btn-add-preset">➕ Nuevo</button>
    </div>
  </div>
</div>

<div class="sheet" id="preset-edit-sheet">
  <div class="sheet-header">
    <h2 id="preset-edit-title">Editar</h2>
    <button id="btn-close-preset-edit">✕</button>
  </div>
  <div class="sheet-body" id="preset-edit-content"></div>
</div>

<div class="sheet" id="newpreset-sheet">
  <div class="sheet-header">
    <h2>Nuevo grupo</h2>
    <button id="btn-close-newpreset">✕</button>
  </div>
  <div class="sheet-body">
    <div class="field required">
      <label>Nombre</label>
      <input type="text" id="newpreset-name" placeholder="Chromebook, Smartboard...">
    </div>
    <div class="field required">
      <label>Icono</label>
      <input type="text" id="newpreset-icon" maxlength="2" value="📦">
    </div>
    <div class="field">
      <label>Nombre fijo del artículo</label>
      <input type="text" id="newpreset-fixed-name" placeholder="Ej: Chromebook (opcional)">
    </div>
    <div class="btn-row">
      <button class="btn primary" id="btn-save-newpreset">Crear</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
(function(){
  "use strict";

  const DB_NAME = 'inventarioPro';
  const DB_VERSION = 1;
  let dbPromise = null;

  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if(!db.objectStoreNames.contains('items')) db.createObjectStore('items', { keyPath: 'id' });
        if(!db.objectStoreNames.contains('presets')) db.createObjectStore('presets', { keyPath: 'id' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  function idbGetAll(store){
    return openDB().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readonly');
      const r = tx.objectStore(store).getAll();
      r.onsuccess = () => resolve(r.result || []);
      r.onerror = () => reject(r.error);
    }));
  }

  function idbPut(store, value){
    return openDB().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).put(value);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    }));
  }

  function idbDelete(store, key){
    return openDB().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    }));
  }

  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(()=>{});
  }

  let presets = [];
  let items = [];
  let activePresetId = null;
  let editingId = null;
  let html5QrCode = null;
  let scanLocked = false;
  let torchOn = false;
  let scanFields = [];
  let currentScanIdx = 0;
  let currentScanData = {};

  const DEFAULT_PRESETS = [
    {
      id: 'preset-chromebooks',
      name: 'Chromebooks',
      icon: '💻',
      fixedName: 'Chromebook',
      fields: [
        { key: 'nombre', label: 'Nombre', type: 'text', fixed: true, continuous: false },
        { key: 'codigo', label: 'Código de barras', type: 'text', required: true, continuous: true },
        { key: 'serial', label: 'Número de serie', type: 'text', continuous: true },
        { key: 'cantidad', label: 'Cantidad', type: 'number', default: 1, continuous: false },
        { key: 'condicion', label: 'Condición', type: 'select', options: ['Nuevo','Bueno','Usado','Dañado'], continuous: false },
        { key: 'ubicacion', label: 'Ubicación', type: 'text', continuous: false }
      ]
    }
  ];

  function uuid(){
    if (crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  }

  function escapeHTML(str){
    return (str==null ? '' : String(str)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function normalize(str){
    return (str==null ? '' : String(str)).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  }

  function todayISO(){
    const d = new Date();
    const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  let toastTimer = null;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
  }

  const backdrop = document.getElementById('backdrop');
  let openSheets = [];
  function openSheet(id){
    backdrop.classList.add('show');
    document.getElementById(id).classList.add('show');
    openSheets.push(id);
  }
  function closeSheet(id){
    document.getElementById(id).classList.remove('show');
    openSheets = openSheets.filter(s => s !== id);
    if(openSheets.length === 0) backdrop.classList.remove('show');
  }
  backdrop.addEventListener('click', () => {
    if(openSheets.length){ closeSheet(openSheets[openSheets.length-1]); }
  });

  function loadPresetsAndItems(){
    return idbGetAll('presets').then(p => {
      presets = (p && p.length) ? p : DEFAULT_PRESETS.map(pr => JSON.parse(JSON.stringify(pr)));
      return idbGetAll('items');
    }).then(it => {
      items = it || [];
      activePresetId = presets[0]?.id || null;
    });
  }

  function savePresets(){
    return Promise.all(presets.map(p => idbPut('presets', p)));
  }

  function getCurrentPreset(){
    return presets.find(p => p.id === activePresetId) || presets[0];
  }

  function renderPresetBar(){
    const bar = document.getElementById('preset-bar');
    bar.innerHTML = '';
    presets.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'preset-btn' + (p.id === activePresetId ? ' active' : '');
      btn.textContent = p.icon + ' ' + p.name;
      btn.onclick = () => {
        activePresetId = p.id;
        renderPresetBar();
        renderList();
        updateStats();
      };
      bar.appendChild(btn);
    });
  }

  function updateStats(){
    const preset = getCurrentPreset();
    const presetItems = items.filter(it => it.presetId === preset.id);
    document.getElementById('stat-count').textContent = items.length;
    document.getElementById('stat-preset').textContent = presetItems.length;
  }

  function renderList(){
    const container = document.getElementById('list-container');
    const empty = document.getElementById('empty-state');
    const preset = getCurrentPreset();
    const list = items.filter(it => it.presetId === preset.id);

    if(list.length === 0){
      container.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    container.innerHTML = '';
    list.forEach(it => {
      const card = document.createElement('div');
      card.className = 'item-card';
      const initials = (it.nombre || '?').trim().slice(0,2).toUpperCase();
      card.innerHTML = `
        <div class="thumb">${escapeHTML(initials)}</div>
        <div class="info">
          <div class="title">${escapeHTML(it.nombre || '(sin nombre)')}</div>
          <div class="sub">#${escapeHTML(it.codigo || '?')}</div>
        </div>
      `;
      card.onclick = () => openItemSheet(it.id);
      container.appendChild(card);
    });
  }

  function buildFieldInput(f, value){
    const id = 'f_' + f.key;
    let html = `<div class="field ${f.required ? 'required':''}"><label for="${id}">${escapeHTML(f.label)}</label>`;
    const val = value == null ? '' : value;
    if(f.type === 'textarea'){
      html += `<textarea id="${id}" data-key="${f.key}">${escapeHTML(val)}</textarea>`;
    } else if(f.type === 'select'){
      html += `<select id="${id}" data-key="${f.key}"><option value="">—</option>`;
      (f.options||[]).forEach(opt => {
        html += `<option value="${escapeHTML(opt)}" ${val===opt?'selected':''}>${escapeHTML(opt)}</option>`;
      });
      html += `</select>`;
    } else if(f.type === 'number'){
      html += `<input type="number" inputmode="decimal" id="${id}" data-key="${f.key}" value="${escapeHTML(val)}">`;
    } else if(f.type === 'date'){
      html += `<input type="date" id="${id}" data-key="${f.key}" value="${escapeHTML(val)}">`;
    } else {
      html += `<input type="text" id="${id}" data-key="${f.key}" value="${escapeHTML(val)}">`;
    }
    html += `</div>`;
    return html;
  }

  function openItemSheet(id, prefill){
    editingId = id || null;
    const preset = getCurrentPreset();
    const item = id ? items.find(it => it.id === id) : (prefill || {});
    document.getElementById('item-sheet-title').textContent = id ? 'Editar' : 'Nuevo artículo';

    let html = '';
    preset.fields.forEach(f => {
      let val = item[f.key];
      if(val == null && !id){
        if(f.default === 'today') val = todayISO();
        else if(f.default != null) val = f.default;
      }
      html += buildFieldInput(f, val);
      if(!id){
        html += `
          <div class="field-lock">
            <input type="checkbox" id="lock_${f.key}" data-key="${f.key}">
            <label for="lock_${f.key}">Fijar campo (no editable)</label>
          </div>
        `;
      }
    });

    html += `<div class="btn-row"><button class="btn primary" id="btn-save-item">Guardar</button></div>`;
    if(id){
      html += `<div class="btn-row"><button class="btn danger" id="btn-delete-item">🗑 Eliminar</button></div>`;
    }
    document.getElementById('item-form-fields').innerHTML = html;

    document.getElementById('btn-save-item').onclick = saveItemFromForm;
    if(id){
      document.getElementById('btn-delete-item').onclick = () => {
        if(confirm('¿Eliminar?')){
          idbDelete('items', id).then(() => {
            items = items.filter(it => it.id !== id);
            closeSheet('item-sheet');
            renderList();
            updateStats();
            showToast('Eliminado');
          });
        }
      };
    }
    openSheet('item-sheet');
  }

  function saveItemFromForm(){
    const data = { presetId: getCurrentPreset().id };
    const preset = getCurrentPreset();
    
    if(preset.fixedName && !editingId){
      data.nombre = preset.fixedName;
    }

    let missingRequired = false;
    preset.fields.forEach(f => {
      const el = document.getElementById('f_' + f.key);
      let v = el ? el.value : '';
      if(f.type === 'number' && v !== '') v = Number(v);
      if(f.required && (v === '' || v == null)) missingRequired = true;
      data[f.key] = v;
    });

    if(missingRequired){
      showToast('Campos obligatorios');
      return;
    }

    const now = Date.now();
    let record;
    if(editingId){
      record = items.find(it => it.id === editingId) || {};
      Object.assign(record, data, { updatedAt: now });
    } else {
      record = Object.assign({ id: uuid(), createdAt: now }, data, { updatedAt: now });
    }

    idbPut('items', record).then(() => {
      const idx = items.findIndex(it => it.id === record.id);
      if(idx >= 0) items[idx] = record; else items.push(record);
      closeSheet('item-sheet');
      renderList();
      updateStats();
      showToast('Guardado');
    });
  }

  function startScanner(){
    const preset = getCurrentPreset();
    scanFields = preset.fields.filter(f => f.continuous && f.type === 'text');
    currentScanIdx = 0;
    currentScanData = {};
    
    if(preset.fixedName) currentScanData.nombre = preset.fixedName;

    scanLocked = false;
    document.getElementById('scanner-overlay').classList.add('show');

    const formats = (window.Html5QrcodeSupportedFormats) ? [
      Html5QrcodeSupportedFormats.QR_CODE,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.CODE_93,
      Html5QrcodeSupportedFormats.CODABAR,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.DATA_MATRIX,
      Html5QrcodeSupportedFormats.AZTEC,
      Html5QrcodeSupportedFormats.PDF_417
    ] : undefined;

    html5QrCode = new Html5Qrcode("scanner-viewport", { formatsToSupport: formats, verbose: false });

    html5QrCode.start(
      { facingMode: "environment" },
      {
        fps: 20,
        qrbox: (vw, vh) => ({
          width: Math.floor(Math.min(vw * 0.88, 420)),
          height: Math.floor(Math.min(Math.min(vw * 0.88, 420) * 0.5, vh * 0.55))
        }),
        disableFlip: true,
        videoConstraints: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
      },
      onScanSuccess,
      () => {}
    ).catch(err => {
      showToast('No acceso a cámara');
      closeScanner();
    });

    updateScannerUI();
  }

  function updateScannerUI(){
    if(scanFields.length === 0){
      document.getElementById('scanner-indicator').style.display = 'none';
      return;
    }
    
    const field = scanFields[currentScanIdx];
    const indicator = document.getElementById('scanner-indicator');
    indicator.style.display = 'block';
    indicator.classList.remove('success');
    document.getElementById('scanner-counter').textContent = `${currentScanIdx + 1} de ${scanFields.length}`;
    document.getElementById('scanner-field-name').textContent = field.label.toUpperCase();
  }

  function onScanSuccess(decodedText){
    if(scanLocked) return;
    scanLocked = true;
    if(navigator.vibrate) navigator.vibrate([70, 50, 70]);

    const field = scanFields[currentScanIdx];
    currentScanData[field.key] = decodedText.trim();

    const indicator = document.getElementById('scanner-indicator');
    indicator.classList.add('success');
    setTimeout(() => {
      if(currentScanIdx < scanFields.length - 1){
        currentScanIdx++;
        updateScannerUI();
        scanLocked = false;
        if(navigator.vibrate) navigator.vibrate(100);
      } else {
        closeScanner();
        openItemSheet(null, currentScanData);
      }
    }, 800);
  }

  function stopScanner(){
    if(!html5QrCode) return Promise.resolve();
    return html5QrCode.stop().then(() => html5QrCode.clear()).catch(()=>{}).finally(() => { html5QrCode = null; });
  }

  function closeScanner(){
    scanFields = [];
    currentScanIdx = 0;
    currentScanData = {};
    document.getElementById('scanner-overlay').classList.remove('show');
    stopScanner();
  }

  function toggleTorch(){
    if(!html5QrCode) return;
    torchOn = !torchOn;
    html5QrCode.applyVideoConstraints({ advanced: [{ torch: torchOn }] }).catch(() => {
      torchOn = !torchOn;
    });
  }

  function exportToExcel(){
    if(items.length === 0){ showToast('Sin datos'); return; }

    const wb = XLSX.utils.book_new();

    presets.forEach(preset => {
      const presetItems = items.filter(it => it.presetId === preset.id);
      if(presetItems.length === 0) return;

      const rows = presetItems.map(it => {
        const row = {};
        preset.fields.forEach(f => {
          row[f.label] = it[f.key] == null ? '' : it[f.key];
        });
        return row;
      });

      const ws = XLSX.utils.json_to_sheet(rows);
      ws['!cols'] = preset.fields.map(f => ({ wch: Math.max(12, f.label.length + 4) }));
      XLSX.utils.book_append_sheet(wb, ws, preset.name.slice(0, 31));
    });

    const pad = n => String(n).padStart(2,'0');
    const d = new Date();
    XLSX.writeFile(wb, `inventario_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.xlsx`);
    showToast('Exportado');
  }

  function renderPresetsList(){
    const wrap = document.getElementById('presets-list');
    wrap.innerHTML = '';
    presets.forEach(p => {
      const count = items.filter(it => it.presetId === p.id).length;
      const row = document.createElement('div');
      row.style.cssText = 'background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;';
      row.innerHTML = `
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;font-size:14.5px;">${p.icon} ${escapeHTML(p.name)}</div>
          <div style="font-size:11.5px;color:var(--muted);">${count} artículos</div>
        </div>
        <button class="mini-btn" id="edit-${p.id}">✎</button>
        <button class="mini-btn del" id="del-${p.id}">✕</button>
      `;
      row.querySelector(`#edit-${p.id}`).style.cssText = 'border:none;background:#f1f5f9;color:var(--text-soft);width:30px;height:30px;border-radius:9px;cursor:pointer;';
      row.querySelector(`#del-${p.id}`).style.cssText = 'border:none;background:#fee2e2;color:var(--danger);width:30px;height:30px;border-radius:9px;cursor:pointer;';
      
      row.querySelector(`#edit-${p.id}`).onclick = () => {
        closeSheet('presets-sheet');
        editPresetDialog(p.id);
      };
      row.querySelector(`#del-${p.id}`).onclick = () => {
        if(confirm(`¿Eliminar "${p.name}"?`)){
          presets = presets.filter(x => x.id !== p.id);
          items = items.filter(it => it.presetId !== p.id);
          activePresetId = presets[0]?.id || null;
          savePresets().then(() => {
            Promise.all(items.map(it => idbPut('items', it))).then(() => {
              renderPresetsList();
              renderPresetBar();
              renderList();
              updateStats();
            });
          });
        }
      };
      wrap.appendChild(row);
    });
  }

  function editPresetDialog(presetId){
    const preset = presets.find(p => p.id === presetId);
    if(!preset) return;

    document.getElementById('preset-edit-title').textContent = 'Editar: ' + preset.name;
    
    let html = `
      <div class="field required">
        <label>Nombre</label>
        <input type="text" id="edit-preset-name" value="${escapeHTML(preset.name)}">
      </div>
      <div class="field required">
        <label>Icono</label>
        <input type="text" id="edit-preset-icon" maxlength="2" value="${preset.icon}">
      </div>
      <div class="field">
        <label>Nombre fijo</label>
        <input type="text" id="edit-preset-fixed-name" value="${escapeHTML(preset.fixedName||'')}">
      </div>

      <h3 style="font-size:15px;margin:16px 0 10px;font-weight:700;">Campos</h3>
      <div id="fields-list"></div>

      <div class="btn-row">
        <button class="btn ghost" id="btn-add-field">➕ Agregar</button>
      </div>

      <div style="margin-top:20px;border-top:1px solid var(--border);padding-top:14px;">
        <div class="btn-row">
          <button class="btn primary" id="btn-save-preset">Guardar</button>
        </div>
        <div class="btn-row">
          <button class="btn danger" id="btn-delete-preset">🗑 Eliminar</button>
        </div>
      </div>
    `;

    document.getElementById('preset-edit-content').innerHTML = html;

    renderFieldsList(preset);

    document.getElementById('btn-save-preset').onclick = () => {
      preset.name = document.getElementById('edit-preset-name').value.trim();
      preset.icon = document.getElementById('edit-preset-icon').value.trim() || '📦';
      preset.fixedName = document.getElementById('edit-preset-fixed-name').value.trim();
      savePresets().then(() => {
        closeSheet('preset-edit-sheet');
        renderPresetBar();
        renderList();
        showToast('Actualizado');
      });
    };

    document.getElementById('btn-delete-preset').onclick = () => {
      if(confirm(`¿Eliminar?`)){
        presets = presets.filter(p => p.id !== presetId);
        items = items.filter(it => it.presetId !== presetId);
        activePresetId = presets[0]?.id || null;
        savePresets().then(() => {
          closeSheet('preset-edit-sheet');
          renderPresetBar();
          renderList();
          updateStats();
        });
      }
    };

    document.getElementById('btn-add-field').onclick = () => {
      addFieldToPreset(preset);
    };

    openSheet('preset-edit-sheet');
  }

  function renderFieldsList(preset){
    const list = document.getElementById('fields-list');
    list.innerHTML = '';

    preset.fields.forEach((f, idx) => {
      const row = document.createElement('div');
      row.style.cssText = 'background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:8px;display:flex;gap:8px;align-items:center;';
      
      const types = { text:'Texto', textarea:'Largo', number:'Número', date:'Fecha', select:'Lista' };
      
      row.innerHTML = `
        <div style="flex:1;">
          <div style="font-weight:700;font-size:14px;">${escapeHTML(f.label)}</div>
          <div style="font-size:11px;color:var(--muted);">${types[f.type]}</div>
        </div>
        ${f.continuous ? '<span style="font-size:9px;background:var(--primary);color:#fff;padding:2px 6px;border-radius:4px;font-weight:700;">Escaneo</span>' : ''}
      `;

      if(!f.fixed){
        row.innerHTML += `
          <button data-act="edit" style="border:none;background:#f1f5f9;color:var(--text-soft);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:13px;">✎</button>
          <button data-act="del" style="border:none;background:#fee2e2;color:var(--danger);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:13px;">✕</button>
        `;
      }

      row.querySelectorAll('button').forEach(btn => {
        btn.onclick = () => {
          const act = btn.dataset.act;
          if(act === 'del'){
            preset.fields.splice(idx, 1);
            renderFieldsList(preset);
          } else if(act === 'edit'){
            editField(preset, idx);
          }
        };
      });

      list.appendChild(row);
    });
  }

  function editField(preset, idx){
    const f = preset.fields[idx];
    let html = `
      <div class="field">
        <label>Nombre</label>
        <input type="text" id="edit-field-label" value="${escapeHTML(f.label)}">
      </div>
      <div class="field">
        <label>Tipo</label>
        <select id="edit-field-type">
          <option value="text" ${f.type==='text'?'selected':''}>Texto</option>
          <option value="textarea" ${f.type==='textarea'?'selected':''}>Largo</option>
          <option value="number" ${f.type==='number'?'selected':''}>Número</option>
          <option value="date" ${f.type==='date'?'selected':''}>Fecha</option>
          <option value="select" ${f.type==='select'?'selected':''}>Lista</option>
        </select>
      </div>
      ${f.type === 'text' ? `
        <div class="field-lock">
          <input type="checkbox" id="edit-field-continuous" ${f.continuous?'checked':''}>
          <label for="edit-field-continuous">Escaneo continuo</label>
        </div>
      ` : ''}
      <div class="btn-row" style="margin-top:16px;">
        <button class="btn primary" id="btn-save-field">Guardar</button>
        <button class="btn ghost" id="btn-cancel-field">Cancelar</button>
      </div>
    `;

    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = html;
    document.getElementById('preset-edit-content').appendChild(tempDiv);

    document.getElementById('btn-save-field').onclick = () => {
      f.label = document.getElementById('edit-field-label').value.trim();
      f.type = document.getElementById('edit-field-type').value;
      if(f.type === 'text'){
        f.continuous = document.getElementById('edit-field-continuous').checked;
      } else {
        f.continuous = false;
      }
      tempDiv.remove();
      renderFieldsList(preset);
    };

    document.getElementById('btn-cancel-field').onclick = () => {
      tempDiv.remove();
    };
  }

  function addFieldToPreset(preset){
    let html = `
      <div class="field">
        <label>Nombre</label>
        <input type="text" id="new-field-label">
      </div>
      <div class="field">
        <label>Tipo</label>
        <select id="new-field-type">
          <option value="text">Texto</option>
          <option value="textarea">Largo</option>
          <option value="number">Número</option>
          <option value="date">Fecha</option>
          <option value="select">Lista</option>
        </select>
      </div>
      <div class="field-lock" id="new-field-cont-wrap">
        <input type="checkbox" id="new-field-continuous">
        <label for="new-field-continuous">Escaneo continuo</label>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="btn-add-field-save">Agregar</button>
      </div>
    `;

    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = html;
    document.getElementById('preset-edit-content').appendChild(tempDiv);

    document.getElementById('new-field-type').addEventListener('change', (e) => {
      document.getElementById('new-field-cont-wrap').style.display = (e.target.value === 'text') ? 'flex' : 'none';
    });

    document.getElementById('btn-add-field-save').onclick = () => {
      const label = document.getElementById('new-field-label').value.trim();
      if(!label){ showToast('Nombre requerido'); return; }
      const newField = {
        key: 'field_' + uuid().slice(0,8),
        label,
        type: document.getElementById('new-field-type').value,
        continuous: document.getElementById('new-field-continuous').checked || false
      };
      preset.fields.push(newField);
      tempDiv.remove();
      renderFieldsList(preset);
    };
  }

  document.getElementById('btn-scan').addEventListener('click', startScanner);
  document.getElementById('btn-close-scanner').addEventListener('click', closeScanner);
  document.getElementById('btn-torch').addEventListener('click', toggleTorch);
  document.getElementById('btn-manual-scan').addEventListener('click', () => {
    const code = window.prompt('Código:');
    if(code){
      const field = scanFields[currentScanIdx];
      if(field) onScanSuccess(code);
    }
  });
  document.getElementById('btn-add-manual').addEventListener('click', () => openItemSheet(null, {}));
  document.getElementById('btn-close-item').addEventListener('click', () => closeSheet('item-sheet'));
  document.getElementById('btn-export').addEventListener('click', exportToExcel);
  document.getElementById('btn-settings').addEventListener('click', () => {
    renderPresetsList();
    openSheet('presets-sheet');
  });
  document.getElementById('btn-close-presets').addEventListener('click', () => closeSheet('presets-sheet'));
  document.getElementById('btn-add-preset').addEventListener('click', () => openSheet('newpreset-sheet'));
  document.getElementById('btn-close-newpreset').addEventListener('click', () => closeSheet('newpreset-sheet'));
  document.getElementById('btn-close-preset-edit').addEventListener('click', () => closeSheet('preset-edit-sheet'));

  document.getElementById('btn-save-newpreset').addEventListener('click', () => {
    const name = document.getElementById('newpreset-name').value.trim();
    const icon = document.getElementById('newpreset-icon').value.trim() || '📦';
    if(!name){ showToast('Nombre requerido'); return; }
    const newPreset = {
      id: 'preset-' + uuid(),
      name, icon,
      fixedName: document.getElementById('newpreset-fixed-name').value.trim(),
      fields: [
        { key: 'nombre', label: 'Nombre', type: 'text', fixed: true, continuous: false },
        { key: 'codigo', label: 'Código de barras', type: 'text', required: true, continuous: true },
        { key: 'cantidad', label: 'Cantidad', type: 'number', default: 1, continuous: false }
      ]
    };
    presets.push(newPreset);
    savePresets().then(() => {
      ['newpreset-name','newpreset-icon','newpreset-fixed-name'].forEach(id => document.getElementById(id).value = '');
      closeSheet('newpreset-sheet');
      renderPresetBar();
      renderList();
      showToast('Creado');
    });
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
    });
  }

  loadPresetsAndItems().then(() => {
    renderPresetBar();
    renderList();
    updateStats();
  }).catch(() => showToast('Error'));

})();
</script>
</body>
</html>
